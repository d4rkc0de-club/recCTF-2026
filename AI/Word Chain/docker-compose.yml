services:
  word-chain:
    build: .
    container_name: word-chain
    restart: unless-stopped
    ports:
      - "5066:5066"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.5
